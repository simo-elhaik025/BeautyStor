version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beautystor_db}
      MYSQL_USER: ${MYSQL_USER:-simo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    # avoid binding host mysql port to prevent conflicts on dev machines
    # use internal docker network; expose only if explicitly needed
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: beautystor-backend:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      # datasource - connect to mysql service by name
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-beautystor_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-simo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-password}
      # JWT and server port (relaxed binding)
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-PT15M}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-P7D}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  mysql_data:
    name: beautystor_mysql_data
